# dev push -> :staging image. Merged "Release vX.Y.Z" PR into main -> :latest + :X.Y.Z images and a GitHub release.
name: Publish

on:
  push:
    branches: [dev]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/kyotensu/drawily

jobs:
  publish:
    if: github.event_name == 'push' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Pick tags
        id: tags
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tags=$IMAGE:staging" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TITLE" =~ ^Release\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::PRs into main must be titled 'Release vX.Y.Z', got: $TITLE"
            exit 1
          fi
          echo "version=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:latest,$IMAGE:${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: steps.tags.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tags.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --generate-notes
